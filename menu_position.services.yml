services:
  menu_position.menu.active_trail:
    class: Drupal\menu_position\Menu\MenuPositionActiveTrail
    decorates: menu.active_trail
    decoration_priority: 9
    autowire: true
    tags:
      - { name: needs_destruction }

  Drupal\menu_position\Hook\MenuPositionHooks:
    class: Drupal\menu_position\Hook\MenuPositionHooks
    autowire: true

  Drupal\menu_position\EventSubscriber\MenuPositionSettingsSubscriber:
    class: Drupal\menu_position\EventSubscriber\MenuPositionSettingsSubscriber
    autowire: true
    tags:
      - { name: event_subscriber }
